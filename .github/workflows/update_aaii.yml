name: Update AAII Sentiment

on:
  schedule:
    # AAII publishes Thursday morning ET. Three Thursday-only attempts.
    # UTC times chosen so coverage holds across DST and EST.
    - cron: '0 13 * * 4'   # 9am EDT / 8am EST
    - cron: '0 14 * * 4'   # 10am EDT / 9am EST
    - cron: '0 17 * * 4'   # 1pm EDT / 12pm EST
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape AAII sentiment
        run: python scripts/aaii_scrape.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aaii_sentiment.csv data/aaii_sentiment.json
          if git diff --cached --quiet; then
            echo "No new AAII data — nothing to commit."
          else
            git commit -m "chore: update AAII sentiment $(date -u +%Y-%m-%d)"
            git push
          fi
